version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: open_edu_bridge_db
    restart: always
    environment:
      POSTGRES_USER: openedu
      POSTGRES_PASSWORD: openedu_dev_password
      POSTGRES_DB: openedubridge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: